# Library palette. bg {{bg}}  bar {{bar}}  surface {{surface}}  text {{text}}
# muted {{dim}}  accent {{accent}}  accent2 {{accent2}}  highlight {{gold}}  green {{green}}

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 12
background_opacity   0.92
hide_window_decorations yes

foreground            {{text}}
background            {{bg}}
selection_foreground  {{text}}
selection_background  {{surface}}
cursor                {{accent}}
cursor_text_color     {{bg}}
url_color             {{gold}}

active_border_color   {{accent}}
inactive_border_color {{surface}}
bell_border_color     {{accent2}}

active_tab_foreground   {{bg}}
active_tab_background   {{accent}}
inactive_tab_foreground {{dim}}
inactive_tab_background {{bar}}
tab_bar_background      {{bar}}
tab_bar_style           separator
tab_separator           " "

mark1_foreground {{bg}}
mark1_background {{gold}}
mark2_foreground {{bg}}
mark2_background {{accent}}
mark3_foreground {{bg}}
mark3_background {{green}}

# 16-colour ANSI set. Normal row: palette colours deepened to sit on the navy
# background (blue, magenta and cyan are derived, the palette has none).
# Bright row: the palette colours themselves where one exists.
# black / bright black
color0  {{surface}}
color8  {{dim}}
# red
color1  {{accent2}}
color9  {{accent}}
# green
color2  {{ansiGreen}}
color10 {{green}}
# yellow
color3  {{ansiYellow}}
color11 {{gold}}
# blue
color4  {{ansiBlue}}
color12 {{ansiBrightBlue}}
# magenta
color5  {{ansiMagenta}}
color13 {{ansiBrightMagenta}}
# cyan
color6  {{ansiCyan}}
color14 {{ansiBrightCyan}}
# white
color7  {{cream2}}
color15 {{text}}

# macOS-style shortcuts, in kitty only. Hyprland does not bind these keys, so
# they reach kitty. ctrl+shift+c and ctrl+shift+v keep working as before.
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+t new_tab
map super+n new_os_window
map super+w close_tab
