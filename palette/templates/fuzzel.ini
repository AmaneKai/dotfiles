[main]
# A card-catalogue card by lamplight: navy stock, cream ink, a typed header with a rule,
# the search box as the "call number" line, the selection as a highlighter stripe
font=Shippori Mincho:size=18
message="蔵書目録  ·  CARD CATALOGUE  ──────────────────────────────"
prompt="請求記号  "
placeholder=書名・著者・件名
terminal=ghostty -e
layer=overlay
anchor=center
width=58
lines=7
line-height=34
letter-spacing=0.6
horizontal-pad=38
vertical-pad=28
inner-pad=18
icons-enabled=no
match-counter=yes

# colours are RRGGBBAA
[colors]
background={{bar:bare:f4}}
text={{text:bare:ff}}
message={{accent:bare:ff}}
prompt={{accent:bare:ff}}
placeholder={{dim:bare:ff}}
input={{text:bare:ff}}
match={{gold:bare:ff}}
# the selected entry is a gold highlighter stripe
selection={{gold:bare:ff}}
selection-text={{bg:bare:ff}}
selection-match={{accent2:bare:ff}}
counter={{dim:bare:ff}}
border={{rule:bare:ff}}

[border]
width=1
radius=0
