backend = "glx";
vsync = true;
unredir-if-possible = true;

corner-radius = 0;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;
shadow-offset-x = -10;
shadow-offset-y = -10;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

rules: (
    {
        match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'Rofi' || class_g = 'Dunst'";
        shadow = false;
    }
);
