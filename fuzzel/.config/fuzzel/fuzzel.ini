[main]
# A card-catalogue card by lamplight: navy stock, cream ink, a typed header with a rule,
# the search box as the "call number" line, the selection as a highlighter stripe
font=Shippori Mincho:size=18
message="蔵書目録  ·  CARD CATALOGUE  ──────────────────────────────"
prompt="請求記号  "
placeholder=書名・著者・件名
terminal=ghostty -e
layer=overlay
anchor=center
width=58
lines=7
line-height=34
letter-spacing=0.6
horizontal-pad=38
vertical-pad=28
inner-pad=18
icons-enabled=no
match-counter=yes

# colours are RRGGBBAA
[colors]
background=070f1cf4
text=f6e7c0ff
message=ce8563ff
prompt=ce8563ff
placeholder=8e7f6bff
input=f6e7c0ff
match=dfba88ff
# the selected entry is a gold highlighter stripe
selection=dfba88ff
selection-text=0a1626ff
selection-match=a65651ff
counter=8e7f6bff
border=3a4d68ff

[border]
width=1
radius=0
