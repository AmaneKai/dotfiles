[colors]
background = #191724
highlight  = #26233a
foreground = #e0def4
muted      = #6e6a86
foam       = #9ccfd8
gold       = #f6c177
alert      = #eb6f92

[bar/base]
width               = 100%
offset-x            = 0
offset-y            = 0
radius              = 0
fixed-center        = true

background          = ${colors.background}
foreground          = ${colors.foreground}

border-size         = 0

padding-left        = 2
padding-right       = 2
module-margin       = 2
line-size           = 2

modules-left        = workspaces title
modules-center      = date
modules-right       = network volume brightness battery tray

bottom              = true

cursor-click        = pointer
cursor-scroll       = ns-resize
screenchange-reload = true

[bar/laptop]
inherit  = bar/base
height   = 36
font-0   = "JetBrainsMono Nerd Font:size=11;3"
font-1   = "JetBrainsMono Nerd Font:size=8;2"
font-2   = "Noto Sans CJK JP:size=11;3"

[bar/monitor]
inherit  = bar/base
height   = 28
font-0   = "JetBrainsMono Nerd Font:size=9;2"
font-1   = "JetBrainsMono Nerd Font:size=7;2"
font-2   = "Noto Sans CJK JP:size=9;2"

[module/workspaces]
type = internal/xworkspaces

format = <label-state>

label-active                = %name%
label-active-foreground     = ${colors.foam}
label-active-background     = ${colors.highlight}
label-active-underline      = ${colors.foam}
label-active-padding        = 2

label-occupied              = %name%
label-occupied-foreground   = ${colors.foreground}
label-occupied-padding      = 2

label-urgent                = %name%
label-urgent-foreground     = ${colors.alert}
label-urgent-padding        = 2

label-empty                 = %name%
label-empty-foreground      = ${colors.muted}
label-empty-padding         = 2

[module/title]
type = internal/xwindow

label            = %title:0:40:...%
label-foreground = ${colors.muted}

[module/date]
type     = internal/date
interval = 5

date   = %a %d %b
time   = %I:%M %p
format = <label>

label            = %date%  %time%
label-foreground = ${colors.foreground}

[module/tray]
type            = internal/tray
tray-padding    = 4
tray-background = ${colors.background}

[module/network]
type           = internal/network
interface-type = wireless
interval       = 5
click-action   = networkmanager_dmenu &

format-connected                  = %{A1:${self.click-action}:}<label-connected>%{A}
format-connected-prefix           = "net "
format-connected-prefix-foreground = ${colors.muted}
label-connected                   = %signal%%

format-disconnected                  = %{A1:${self.click-action}:}<label-disconnected>%{A}
format-disconnected-prefix           = "net "
format-disconnected-prefix-foreground = ${colors.muted}
label-disconnected                   = off
label-disconnected-foreground        = ${colors.muted}

[module/volume]
type = internal/pulseaudio

format-volume                   = <label-volume>
format-volume-prefix            = "vol "
format-volume-prefix-foreground = ${colors.muted}
label-volume                    = %percentage%%

format-muted                   = <label-muted>
format-muted-prefix            = "vol "
format-muted-prefix-foreground = ${colors.muted}
label-muted                    = muted
label-muted-foreground         = ${colors.muted}

click-left  = bash ~/.config/i3/scripts/audio-menu.sh &
click-right = pactl set-sink-mute @DEFAULT_SINK@ toggle
scroll-up   = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%

[module/brightness]
type          = internal/backlight
card          = intel_backlight
enable-scroll = false

format                   = <label>
format-prefix            = "bri "
format-prefix-foreground = ${colors.muted}
label                    = %percentage%%

[module/battery]
type          = internal/battery
battery       = BAT1
adapter       = AC
full-at       = 98
poll-interval = 10
click-action  = ~/.config/i3/scripts/osd.sh profile

format-discharging                   = %{A1:${self.click-action}:}<label-discharging>%{A}
format-discharging-prefix            = "bat "
format-discharging-prefix-foreground = ${colors.muted}
label-discharging                    = %percentage%%

format-charging                   = %{A1:${self.click-action}:}<label-charging>%{A}
format-charging-prefix            = "chg "
format-charging-prefix-foreground = ${colors.muted}
label-charging                    = %percentage%%
label-charging-foreground         = ${colors.gold}

format-full                   = %{A1:${self.click-action}:}<label-full>%{A}
format-full-prefix            = "bat "
format-full-prefix-foreground = ${colors.muted}
label-full                    = full
label-full-foreground         = ${colors.foam}

format-low                   = %{A1:${self.click-action}:}<label-low>%{A}
format-low-prefix            = "bat "
format-low-prefix-foreground = ${colors.muted}
label-low                    = %percentage%%
label-low-foreground         = ${colors.alert}

low-at = 20
