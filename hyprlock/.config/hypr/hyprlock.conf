# Wallpaper behind a navy panel. Colours are rgba(RRGGBBAA).

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/library-empty.png
    blur_passes = 2
    blur_size = 4
    noise = 0.03
    brightness = 0.7
}

# the panel
shape {
    monitor =
    size = 460, 300
    color = rgba(070f1cdd)
    rounding = 0
    border_size = 1
    border_color = rgba(ce8563ff)

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    color = rgba(f6e7c0ff)
    font_size = 64
    font_family = Shippori Mincho

    position = 0, 70
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%Y年%m月%d日 (%a)"
    color = rgba(8e7f6bff)
    font_size = 16
    font_family = Shippori Mincho

    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 44
    outline_thickness = 1
    rounding = 0
    inner_color = rgba(0a1626ff)
    outer_color = rgba(3a4d68ff)
    check_color = rgba(dfba88ff)
    fail_color = rgba(a65651ff)
    font_color = rgba(f6e7c0ff)
    font_family = Shippori Mincho
    fade_on_empty = false
    placeholder_text = <i>…</i>
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -70
    halign = center
    valign = center
}
