# Library palette. bg #0a1626  bar #070f1c  surface #283a51  text #f6e7c0
# muted #8e7f6b  accent #ce8563  accent2 #a65651  highlight #dfba88  green #c8cdab

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

window_padding_width 12
background_opacity   0.92
hide_window_decorations yes

foreground            #f6e7c0
background            #0a1626
selection_foreground  #f6e7c0
selection_background  #283a51
cursor                #ce8563
cursor_text_color     #0a1626
url_color             #dfba88

active_border_color   #ce8563
inactive_border_color #283a51
bell_border_color     #a65651

active_tab_foreground   #0a1626
active_tab_background   #ce8563
inactive_tab_foreground #8e7f6b
inactive_tab_background #070f1c
tab_bar_background      #070f1c
tab_bar_style           separator
tab_separator           " "

mark1_foreground #0a1626
mark1_background #dfba88
mark2_foreground #0a1626
mark2_background #ce8563
mark3_foreground #0a1626
mark3_background #c8cdab

# 16-colour ANSI set. Normal row: palette colours deepened to sit on the navy
# background (blue, magenta and cyan are derived, the palette has none).
# Bright row: the palette colours themselves where one exists.
# black / bright black
color0  #283a51
color8  #8e7f6b
# red
color1  #a65651
color9  #ce8563
# green
color2  #9aa688
color10 #c8cdab
# yellow
color3  #c4a066
color11 #dfba88
# blue
color4  #5b7fa6
color12 #7fa3c9
# magenta
color5  #9c6b86
color13 #bf8aa6
# cyan
color6  #6f9c9a
color14 #98c1bd
# white
color7  #d9c9a0
color15 #f6e7c0

# macOS-style shortcuts, in kitty only. Hyprland does not bind these keys, so
# they reach kitty. ctrl+shift+c and ctrl+shift+v keep working as before.
map super+c copy_to_clipboard
map super+v paste_from_clipboard
map super+t new_tab
map super+n new_os_window
map super+w close_tab
