# --- core ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle:extkeys"
set -as terminal-features ",xterm-256color:RGB:clipboard:hyperlinks:usstyle:extkeys" # wezterm
set -s escape-time 0
set -s extended-keys on # lets apps see shift+enter etc.
set -s extended-keys-format csi-u
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g display-time 1500
set -g mode-keys vi
set -g status-keys vi
set -g wrap-search off

# --- look (Rose Pine, transparent) ---
set -g status-style 'bg=default fg=#6e6a86'
set -g status-interval 5
set -g status-left '#[fg=#c4a7e7,bold] #{=16:session_name}#[default]   '
set -g status-left-length 24
set -g status-right '#{?client_prefix,#[fg=#eb6f92]PREFIX  ,}#{?window_zoomed_flag,#[fg=#f6c177]ZOOM  ,}#[fg=#ebbcba]#("$DOTFILES/bin/tmux-git-branch" "#{pane_current_path}") #[fg=#9ccfd8]%H:%M '
set -g status-right-length 60
set -g window-status-format '#I #{=16:window_name}'
set -g window-status-current-format '#[fg=#e0def4,bold]#I #{=16:window_name}'
set -g window-status-separator '   '
set -g message-style 'bg=default fg=#f6c177'
set -g mode-style 'bg=#26233a fg=#e0def4'
set -g pane-border-style 'fg=#26233a'
set -g pane-active-border-style 'fg=#c4a7e7'
set -g popup-style 'bg=default fg=default'
set -g popup-border-style 'fg=#c4a7e7'
set -g popup-border-lines rounded
set -g display-panes-colour '#6e6a86'
set -g display-panes-active-colour '#c4a7e7'

# --- window names ---
set -g automatic-rename-format '#{?#{||:#{m:*sh,#{pane_current_command}},#{m/r:^([0-9]+\.[0-9]+\.[0-9]+|claude|agy|antigravity|gemini)$,#{pane_current_command}}},#{b:pane_current_path},#{pane_current_command}}'

# --- keys ---
set -g prefix C-a
unbind C-b
bind C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message 'reloaded'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
if-shell '[ -n "$WAYLAND_DISPLAY" ]' "set -s copy-command 'wl-copy'" "set -s copy-command 'xclip -in -selection clipboard'"

# new windows and splits keep the current directory
bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'
bind | split-window -h -c '#{pane_current_path}'

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# reorder windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -r ^ last-window

# --- sessions ---
run-shell 'tmux set-environment -g DOTFILES "$(dirname "$(dirname "$(readlink -f ~/.tmux.conf)")")"'

bind -r f run-shell 'tmux neww "$DOTFILES/bin/tmux-sessionizer"'
bind -r G run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/Github'
bind -r C run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/College'
bind -r O run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/Codes'
bind -r D run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/Downloads'
bind -r H run-shell '"$DOTFILES/bin/tmux-sessionizer" "$DOTFILES"'
bind -r L run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/LBYARCH'

# --- popups ---
bind g display-popup -E -w 80% -h 80% -d '#{pane_current_path}' -T ' scratch ' "$SHELL"
bind e display-popup -E -w 85% -h 85% -d '#{pane_current_path}' -T ' files ' spf

%hidden HOPES_POPUP="display-popup -E -w 75% -h 75% 'exec hopes'"
bind t $HOPES_POPUP
bind T $HOPES_POPUP
