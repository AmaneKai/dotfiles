set -g mouse on
set -g base-index 1
set -g status-style 'bg=default fg=default'

# Prefix: Ctrl+A
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf

# Vi copy mode
set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# New window/pane stays in current path
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# =============================================================================
# THE SESSIONIZER SECTION
# =============================================================================
# Fuzzy find
bind-key -r f run-shell "tmux neww ~/Dotfiles/bin/tmux-sessionizer"

# Specific jumps
bind-key -r G run-shell "~/Dotfiles/bin/tmux-sessionizer ~/Github"
bind-key -r C run-shell "~/Dotfiles/bin/tmux-sessionizer ~/College"
bind-key -r O run-shell "~/Dotfiles/bin/tmux-sessionizer ~/Codes"
bind-key -r D run-shell "~/Dotfiles/bin/tmux-sessionizer ~/Downloads"
bind-key -r H run-shell "~/Dotfiles/bin/tmux-sessionizer ~/Dotfiles"

bind-key t display-popup -E -w 75% -h 75% "$HOME/.cargo/bin/hopes"
bind-key T display-popup -E -w 75% -h 75% "$HOME/.cargo/bin/hopes"
