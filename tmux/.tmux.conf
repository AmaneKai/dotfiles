# --- core ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:clipboard:hyperlinks:usstyle"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on
set -g escape-time 0
set -g history-limit 50000
set -g set-clipboard on
set -g allow-passthrough on
set -g detach-on-destroy off
set -g display-time 1500
setw -g mode-keys vi
set -g status-keys vi
setw -g aggressive-resize on
setw -g monitor-activity on
set -g visual-activity off
set -g wrap-search off

# --- look (Rose Pine, transparent bar to match ghostty) ---
set -g status-style 'bg=default fg=default'
set -g message-style 'bg=default fg=#f6c177'
set -g mode-style 'bg=#26233a fg=#e0def4'
set -g pane-border-style 'fg=#26233a'
set -g pane-active-border-style 'fg=#c4a7e7'
set -g popup-style 'bg=default fg=default'
set -g popup-border-style 'fg=#c4a7e7'
set -g popup-border-lines rounded
set -g display-panes-colour '#6e6a86'
set -g display-panes-active-colour '#c4a7e7'

# --- window names ---
# claude reports its version as the command (e.g. 2.1.310); shells show the folder instead of "zsh"
set -g automatic-rename-format '#{?#{m:[0-9]*.[0-9]*.[0-9]*,#{pane_current_command}},claude,#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}}'

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind r source-file ~/.tmux.conf \; display-message 'reloaded'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# extra, easier-to-remember splits (" and % still work)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# reorder windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

run-shell 'tmux set-environment -g DOTFILES "$(dirname "$(dirname "$(readlink -f ~/.tmux.conf)")")"'

bind-key -r f run-shell 'tmux neww "$DOTFILES/bin/tmux-sessionizer"'

bind-key -r G run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/Github'
bind-key -r C run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/College'
bind-key -r O run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/Codes'
bind-key -r D run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/Downloads'
bind-key -r H run-shell '"$DOTFILES/bin/tmux-sessionizer" "$DOTFILES"'
bind-key -r L run-shell '"$DOTFILES/bin/tmux-sessionizer" ~/LBYARCH'

# floating scratch shell in the current directory
bind-key g display-popup -E -w 80% -h 80% -b rounded -d '#{pane_current_path}' -T ' scratch ' "$SHELL"

# file manager popup in the current directory
bind-key e display-popup -E -w 85% -h 85% -b rounded -d '#{pane_current_path}' -T ' files ' spf

%hidden HOPES_POPUP="display-popup -E -w 75% -h 75% $HOME/.cargo/bin/hopes"
bind-key t $HOPES_POPUP
bind-key T $HOPES_POPUP
