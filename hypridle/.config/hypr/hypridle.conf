# Idle handling: dim, lock, screen off, suspend. Commands follow Hyprland 0.57's
# Lua dispatcher form (see /usr/share/hypr/hypridle.conf).

general {
    lock_cmd = qs -c library ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session                          # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # screen back on after resume
}

listener {
    timeout = 150                                # 2.5 min: dim the backlight
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 1800                               # 30 min: suspend
    on-timeout = systemctl suspend
}
